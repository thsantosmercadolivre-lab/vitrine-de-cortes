<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0a">
<title>Vitrine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&family=Nunito:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="dados.js?v=da092ff7"></script>
<style>
  /* Vitrine premium (31/10, pedido do Thiago): topo editorial (serifa grande, linhas finas douradas),
     destaque estilo streaming com botoes 3D, cortes em grade com o titulo sobre a imagem.
     Vale pra galeria com "template": "premium" no json do cliente. So assistir e baixar, sem pedido. */
  :root{
    --fundo:#0b0b0a; --sup:#141412; --sup2:#1c1b18;
    --creme:#efe9dc; --creme2:rgba(239,233,220,.68); --creme3:rgba(239,233,220,.42);
    --linha:rgba(239,233,220,.14); --ouro:#c9a84c; --ouro-luz:#e6cf8a; --ouro-esc:#8c6d2c;
    --serifa:"Cormorant Garamond", Georgia, serif; --didone:"Bodoni Moda", Georgia, serif;
    --caps:"Jost", sans-serif; --num:"Nunito", sans-serif; --ui:"Inter", -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:var(--fundo); color:var(--creme); font-family:var(--ui); -webkit-font-smoothing:antialiased; overflow-x:hidden}
  body::before{content:""; position:fixed; inset:0 0 auto 0; height:70vh; pointer-events:none; z-index:0;
    background:radial-gradient(60% 60% at 50% 0%, rgba(201,168,76,.10), transparent 70%)}
  .wrap{max-width:1180px; margin:0 auto; padding:0 56px; position:relative; z-index:1}
  img{display:block; max-width:100%}
  @keyframes sobe{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  .rev{opacity:0; animation:sobe .7s cubic-bezier(.2,.75,.25,1) forwards; animation-delay:var(--d,0ms)}
  @media (prefers-reduced-motion:reduce){ .rev{animation:none; opacity:1} }

  /* ------------------------------------------------------------- topo (A) */
  .topo{display:flex; justify-content:space-between; align-items:center; gap:20px; padding:34px 0 18px;
    border-bottom:1px solid var(--linha)}
  .topo img{height:62px; width:auto}
  .topo span{font:400 11px var(--caps); letter-spacing:.32em; text-transform:uppercase; color:var(--creme3); text-align:right}
  header{padding:64px 0 10px}
  .olho{font:400 11px var(--caps); letter-spacing:.32em; text-transform:uppercase; color:var(--ouro)}
  h1{font:400 clamp(48px,8.6vw,96px)/.95 var(--serifa); letter-spacing:-.01em; margin-top:22px}
  h1 em{font-style:italic; color:var(--ouro)}
  .lead{font:300 16px/1.7 var(--caps); color:var(--creme2); max-width:560px; margin-top:24px}
  .meta{display:flex; flex-wrap:wrap; gap:10px 34px; margin-top:34px}
  .meta div{font:300 13px var(--caps); color:var(--creme3)}
  .meta b{display:block; font:600 28px var(--num); color:var(--creme); margin-bottom:2px; letter-spacing:-.01em}

  /* baixar todos (ZIP na Release do GitHub, gerado pelo zipar.py) */
  .todos{display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-top:34px}
  .todos small{font:300 13px/1.5 var(--caps); color:var(--creme3)}
  .todos small b{color:var(--creme2); font-weight:400}

  /* ------------------------------------------------------------- secoes */
  .sec{display:flex; align-items:center; gap:18px; margin:78px 0 26px;
    font:400 11.5px var(--caps); letter-spacing:.3em; text-transform:uppercase; color:var(--ouro); scroll-margin-top:20px}
  .sec::after{content:""; flex:1; height:1px; background:linear-gradient(90deg, rgba(201,168,76,.45), rgba(201,168,76,.08))}
  .sec small{font-size:11px; color:var(--creme3); letter-spacing:.2em; order:3}
  .sec-sub{font:italic 400 19px var(--serifa); color:var(--creme2); margin:-12px 0 24px}

  /* ------------------------------------------------------ botoes 3D (B) */
  .b3d{display:inline-flex; align-items:center; justify-content:center; gap:9px; cursor:pointer; border:0;
    font:600 14.5px var(--ui); letter-spacing:-.005em; text-decoration:none; border-radius:999px;
    padding:15px 28px; position:relative; transition:transform .12s, box-shadow .12s, filter .2s; white-space:nowrap}
  .b3d svg{width:15px; height:15px; fill:currentColor}
  .b3d:active{transform:translateY(3px)}
  .b3d.claro{color:#111; background:linear-gradient(180deg,#ffffff 0%,#ecebe6 55%,#d9d7cf 100%);
    box-shadow:inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.08), 0 4px 0 #a9a69b, 0 14px 26px -8px rgba(0,0,0,.65)}
  .b3d.claro:active{box-shadow:inset 0 1px 0 #fff, 0 1px 0 #a9a69b, 0 6px 14px -6px rgba(0,0,0,.6)}
  .b3d.ouro{color:#1d1708; background:linear-gradient(180deg,#f3e3b0 0%,#d6b766 48%,#b8933f 100%);
    box-shadow:inset 0 1px 0 rgba(255,250,230,.9), inset 0 -2px 0 rgba(0,0,0,.12), 0 4px 0 #7a5d24, 0 14px 26px -8px rgba(0,0,0,.65)}
  .b3d.ouro:active{box-shadow:inset 0 1px 0 rgba(255,250,230,.9), 0 1px 0 #7a5d24, 0 6px 14px -6px rgba(0,0,0,.6)}
  .b3d:hover{filter:brightness(1.05)}
  .b3d.peq{padding:10px 16px; font-size:12.5px; width:100%}
  .b3d.peq svg{width:13px; height:13px}

  /* --------------------------------------------- destaque estilo streaming */
  .banner{position:relative; border-radius:18px; overflow:hidden; min-height:520px; display:grid;
    grid-template-columns:1.15fr .85fr; align-items:center; border:1px solid var(--linha); background:#000}
  .banner .fundo{position:absolute; inset:0; background-size:cover; background-position:center; transform:scale(1.08); opacity:.75}
  .banner::after{content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, #070706 10%, rgba(7,7,6,.72) 52%, rgba(7,7,6,.25) 100%),
               linear-gradient(0deg, rgba(7,7,6,.85), transparent 45%)}
  .banner .txt{position:relative; z-index:2; padding:56px 0 56px 56px}
  .banner .tag{font:500 11px var(--caps); letter-spacing:.3em; text-transform:uppercase; color:var(--ouro-luz)}
  .banner h2{font:400 clamp(46px,6.4vw,78px)/1 var(--didone); margin:16px 0 10px; letter-spacing:-.01em}
  .banner .artista{font:italic 400 24px var(--serifa); color:var(--creme)}
  .banner .linha{font:300 15px/1.65 var(--caps); color:var(--creme2); max-width:470px; margin-top:14px}
  .banner .info{display:flex; gap:16px; font:400 12px var(--caps); letter-spacing:.14em; color:var(--creme3); margin-top:18px; text-transform:uppercase}
  .banner .btns{display:flex; flex-wrap:wrap; gap:14px; margin-top:30px}
  .banner .cartaz{position:relative; z-index:2; justify-self:center; width:min(270px,80%); aspect-ratio:9/16; border-radius:16px;
    overflow:hidden; cursor:pointer; border:1px solid rgba(239,233,220,.22); padding:0; background:#000;
    box-shadow:0 40px 80px -30px #000, 0 0 0 7px rgba(201,168,76,.12)}
  .banner .cartaz img{width:100%; height:100%; object-fit:cover; transition:transform .5s}
  .banner .cartaz:hover img{transform:scale(1.04)}
  .playbig{position:absolute; inset:0; display:grid; place-items:center}
  .playbig span{width:66px; height:66px; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(225,223,215,.95));
    box-shadow:inset 0 1px 0 #fff, 0 4px 0 rgba(120,118,110,.9), 0 16px 30px -8px rgba(0,0,0,.7)}
  .playbig svg{width:22px; height:22px; fill:#111; margin-left:4px}

  /* processo do destaque (ficha tecnica) */
  .ficha{display:grid; grid-template-columns:260px 1fr; gap:48px; margin-top:34px; padding-top:34px; border-top:1px solid var(--linha)}
  .ficha h3{font:400 34px/1.05 var(--serifa)} .ficha h3 em{font-style:italic; color:var(--ouro)}
  .ficha .resumo{font:300 14.5px/1.7 var(--caps); color:var(--creme2); margin-top:14px}
  .ficha .resumo b{color:var(--creme); font-weight:500}
  .numeros{display:grid; grid-template-columns:1fr 1fr; gap:18px 14px; margin-top:26px}
  .numeros b{display:block; font:700 25px var(--num); color:var(--ouro-luz); white-space:nowrap; letter-spacing:-.01em}
  .numeros span{font:300 12px/1.4 var(--caps); color:var(--creme3)}
  .ficha ol{list-style:none; counter-reset:x; columns:2; column-gap:40px}
  .ficha li{counter-increment:x; break-inside:avoid; display:grid; grid-template-columns:34px 1fr; padding:13px 0;
    border-bottom:1px solid var(--linha); font:300 14px/1.62 var(--caps); color:var(--creme2)}
  .ficha li::before{content:counter(x,decimal-leading-zero); font:700 14px var(--num); color:var(--ouro); padding-top:2px}
  .ficha li b{color:var(--creme); font-weight:500}
  .ficha .mais{display:none; background:none; border:1px solid rgba(201,168,76,.45); color:var(--ouro-luz); border-radius:999px;
    padding:11px 22px; font:400 11px var(--caps); letter-spacing:.24em; text-transform:uppercase; cursor:pointer}
  .ficha:not(.fechada) .mais{display:none !important}
  /* programas usados: cartao com o logo oficial na cor da marca, nome e funcao */
  .progs{margin-top:26px}
  .progs em{display:block; font:400 10.5px var(--caps); font-style:normal; letter-spacing:.28em; text-transform:uppercase; color:var(--creme3); margin-bottom:12px}
  .progs .apps{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .progs .app{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    background:linear-gradient(180deg,#1b1a17,#121210); border:1px solid rgba(239,233,220,.09)}
  .progs .app img{width:30px; height:30px; flex-shrink:0}
  .progs .app b{display:block; font:600 13.5px var(--ui); color:var(--creme)}
  .progs .app small{display:block; font:300 11.5px var(--caps); color:var(--creme3); margin-top:1px}
  .progs .txt-only{font:400 12.5px var(--caps); padding:6px 13px; border-radius:8px; border:1px solid rgba(201,168,76,.35); color:var(--creme)}

  /* ------------------------------------------------- grade de cortes (B) */
  .grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:26px 16px}
  .card .thumb{position:relative; display:block; width:100%; aspect-ratio:9/16; border-radius:10px; overflow:hidden;
    cursor:pointer; border:0; padding:0; background:#000; box-shadow:0 18px 36px -22px #000}
  .card .thumb img{width:100%; height:100%; object-fit:cover; transition:transform .45s, filter .3s; filter:brightness(.92)}
  .card .thumb::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(0,0,0,.86) 0%, rgba(0,0,0,.25) 38%, transparent 60%)}
  .card:hover .thumb img{transform:scale(1.045); filter:brightness(1)}
  .card .t{position:absolute; left:12px; right:12px; bottom:12px; z-index:2; text-align:left;
    font:500 13.5px/1.32 var(--ui); color:#fff; text-shadow:0 1px 10px rgba(0,0,0,.8)}
  .card .n{position:absolute; left:12px; top:12px; z-index:2; font:700 12.5px var(--num); color:var(--ouro-luz); text-shadow:0 1px 8px rgba(0,0,0,.8)}
  .card .dur{position:absolute; right:10px; top:10px; z-index:2; font:500 11px var(--ui); color:#fff;
    background:rgba(0,0,0,.55); backdrop-filter:blur(6px); padding:3px 8px; border-radius:999px}
  .card .b3d{margin-top:12px}

  footer{margin:96px 0 0; padding:40px 0 60px; border-top:1px solid var(--linha); text-align:center;
    font:300 13px/1.8 var(--caps); color:var(--creme3)}
  footer img{height:46px; width:auto; margin:0 auto 16px; opacity:.9}

  /* ------------------------------------------------------------- player */
  .modal{position:fixed; inset:0; z-index:60; background:rgba(5,5,4,.93); backdrop-filter:blur(14px);
    display:none; align-items:center; justify-content:center; padding:20px}
  .modal.on{display:flex}
  .palco{position:relative; width:min(410px,100%); display:flex; flex-direction:column; gap:14px}
  .palco video{width:100%; max-height:72vh; border-radius:14px; background:#000; display:block; border:1px solid var(--linha)}
  .palco-bar{display:flex; gap:12px; align-items:center}
  .palco-bar .tit{font:400 19px/1.25 var(--serifa); color:var(--creme); flex:1; text-align:center}
  .nav-b{width:42px; height:42px; border-radius:50%; flex-shrink:0; border:1px solid var(--linha); background:var(--sup2);
    color:var(--creme); font-size:19px; cursor:pointer}
  .nav-b:disabled{opacity:.25; cursor:default}
  .fechar{position:absolute; top:-46px; right:-4px; background:none; border:0; color:var(--creme2); font-size:30px; cursor:pointer; padding:6px}

  @media (max-width:860px){
    .wrap{padding:0 18px}
    .topo img{height:46px} .topo span{font-size:9.5px; letter-spacing:.22em}
    header{padding:44px 0 0}
    /* celular igual ao app da Netflix: a foto do destaque ocupa o banner inteiro e o texto
       e os botoes ficam por cima, no degrade de baixo */
    .banner{display:flex; flex-direction:column; justify-content:flex-end; min-height:0; aspect-ratio:9/15;
      margin:0 -18px; border-radius:0; border-left:0; border-right:0}
    .banner .fundo{display:none}
    .banner .cartaz{position:absolute; inset:0; width:100%; height:100%; aspect-ratio:auto; margin:0; z-index:0;
      border:0; border-radius:0; box-shadow:none}
    .banner .cartaz img{object-position:center 30%}
    .banner .playbig{display:none}
    .banner::after{z-index:1; background:linear-gradient(0deg,#070706 4%, rgba(7,7,6,.88) 30%, rgba(7,7,6,.15) 62%, rgba(7,7,6,.35) 100%)}
    .banner .txt{z-index:3; padding:0 20px 28px; text-align:center}
    .banner h2{margin:12px 0 6px}
    .banner .linha{margin:10px auto 0; font-size:14px}
    .banner .info,.banner .btns{justify-content:center}
    .banner .btns{flex-wrap:nowrap; gap:10px; margin-top:22px}
    .banner .btns .b3d{flex:1; padding:14px 12px}
    .ficha{grid-template-columns:1fr; gap:26px}
    .ficha ol{columns:1}
    .ficha.fechada li:nth-child(n+4){display:none}
    .progs .apps{grid-template-columns:1fr 1fr}
    .progs .app{padding:11px 12px; gap:10px}
    .progs .app img{width:26px; height:26px}
    .ficha .mais{display:flex; margin:18px auto 0}
    /* cortes em fileira que desliza pro lado, como as linhas da Netflix */
    .grade{display:grid; grid-auto-flow:column; grid-auto-columns:44%; grid-template-columns:none; gap:12px;
      overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding:0 18px; margin:0 -18px; padding:0 18px 6px; scrollbar-width:none;
      -webkit-overflow-scrolling:touch}
    .grade::-webkit-scrollbar{display:none}
    .card{scroll-snap-align:start}
    .card .t{font-size:12.5px}
    .sec{margin-top:60px}
    .b3d{padding:14px 22px}
  }
  /* card de documento no fim (legendas .docx) */
  .docx{display:grid; grid-template-columns:minmax(0,260px) 1fr; gap:34px; align-items:center;
    background:var(--sup); border:1px solid var(--linha); border-radius:18px; padding:28px; margin-top:8px}
  .docx-capa img{display:block; width:100%; border-radius:10px; box-shadow:0 18px 40px -18px rgba(0,0,0,.8)}
  .docx-txt .tag{font-family:var(--caps); font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--ouro); margin-bottom:10px}
  .docx-txt h2{font-family:var(--serifa); font-weight:500; font-size:clamp(28px,4vw,40px); line-height:1.08; color:var(--creme); margin-bottom:12px}
  .docx-txt .linha{color:var(--creme2); font-size:15px; line-height:1.6; margin-bottom:22px; max-width:46ch}
  @media (max-width:640px){ .docx{grid-template-columns:1fr; gap:22px; padding:20px} .docx-capa{max-width:240px; margin:0 auto} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topo rev" style="--d:0ms"><img id="logo" alt="" hidden><span id="credito"></span></div>
  <header>
    <div class="olho rev" id="olho" style="--d:80ms"></div>
    <h1 class="rev" id="titulo" style="--d:150ms"></h1>
    <p class="lead rev" id="subtitulo" style="--d:230ms"></p>
    <div class="meta rev" id="meta" style="--d:300ms"></div>
    <div class="todos rev" id="todos" style="--d:340ms" hidden></div>
  </header>
  <main id="secoes"></main>
  <footer id="rodape"></footer>
</div>

<div class="modal" id="modal">
  <div class="palco">
    <button class="fechar" id="x" aria-label="Fechar">&times;</button>
    <video id="player" controls playsinline controlsList="noremoteplayback" disablePictureInPicture></video>
    <div class="palco-bar">
      <button class="nav-b" id="prev" aria-label="Anterior">&#8249;</button>
      <div class="tit" id="ptit"></div>
      <button class="nav-b" id="next" aria-label="Próximo">&#8250;</button>
    </div>
    <a class="b3d ouro" id="pdown" hidden></a>
  </div>
</div>

<script>
(function(){
  "use strict";
  var G = window.GALERIA;
  if(!G){ document.body.innerHTML = '<p style="padding:40px;color:#fff">dados.js não carregou.</p>'; return; }
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var md = function(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); };
  var IC_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  var IC_DOWN = '<svg viewBox="0 0 24 24"><path d="M11 3h2v10.2l3.6-3.6 1.4 1.4-6 6-6-6 1.4-1.4 3.6 3.6zM5 19h14v2H5z"/></svg>';
  var GRUPOS = (G.grupos || []).filter(function(g){ return G.cortes.some(function(c){ return c.grupo === g.nome; }); });
  // ordem de navegacao do player = ordem das secoes na tela
  var ORDEM = [];
  GRUPOS.forEach(function(g){ G.cortes.forEach(function(c){ if(c.grupo === g.nome) ORDEM.push(c); }); });
  G.cortes.forEach(function(c){ if(ORDEM.indexOf(c) < 0) ORDEM.push(c); });

  /* ---------------------------------------------------------------- topo */
  document.title = G.titulo.replace(/\*/g, "") + (G.cliente ? " · " + G.cliente : "");
  if(G.logo){ $("logo").src = G.logo; $("logo").hidden = false; $("logo").alt = G.cliente; }
  $("credito").textContent = G.credito || "";
  $("olho").textContent = G.olho || "";
  $("titulo").innerHTML = esc(G.titulo).replace(/\*([^*]+)\*/g, "<em>$1</em>");
  $("subtitulo").textContent = G.subtitulo || "";
  var seg = G.cortes.reduce(function(a, c){ return a + (c.duracao || 0); }, 0);
  $("meta").innerHTML = (G.meta || [[G.cortes.length, "vídeos prontos"], [Math.round(seg/60) + " min", "de conteúdo"]])
    // {total} no json vira a quantidade de videos na galeria, sempre atualizada pelo vigia
    .map(function(m){ return "<div><b>" + esc(String(m[0]).replace("{total}", G.cortes.length)) + "</b>" + esc(m[1]) + "</div>"; }).join("");

  if(G.zip && G.zip.url){
    $("todos").hidden = false;
    $("todos").innerHTML = '<a class="b3d ouro" href="' + G.zip.url + '">' + IC_DOWN + 'Baixar todos os cortes</a>' +
      '<small>Pasta .zip com <b>' + G.zip.qtd + ' vídeos</b> · ' + G.zip.mb + ' MB' +
      (G.zip.hora ? '<br>atualizada em ' + esc(G.zip.hora) : '') + '</small>';
  }

  function baixar(c, cls){
    return G.download ? '<a class="b3d ouro ' + (cls || "") + '" href="' + c.video + '" download="' + esc(c.titulo) + '.mp4">' +
      IC_DOWN + 'Baixar vídeo</a>' : "";
  }

  function card(c, n){
    var i = ORDEM.indexOf(c);
    return '<article class="card rev" style="--d:' + (380 + Math.min(n, 10) * 40) + 'ms">' +
      '<button class="thumb" data-i="' + i + '" aria-label="Assistir ' + esc(c.titulo) + '">' +
        '<img src="' + c.poster + '" alt="" loading="lazy">' +
        '<span class="n">nº ' + String(n + 1).padStart(2, "0") + '</span>' +
        '<span class="dur">' + c.duracao_texto + '</span>' +
        '<span class="t">' + esc(c.titulo) + '</span>' +
      '</button>' + baixar(c, "peq") +
    '</article>';
  }

  function destaque(c){
    var p = c.processo, b = p.banner || {}, i = ORDEM.indexOf(c);
    return '<div class="banner rev" style="--d:360ms">' +
        (b.fundo ? '<div class="fundo" style="background-image:url(\'' + b.fundo + '\')"></div>' : '') +
        '<div class="txt">' +
          (b.tag ? '<div class="tag">' + esc(b.tag) + '</div>' : '') +
          '<h2>' + esc(b.titulo || c.titulo) + '</h2>' +
          (b.artista ? '<div class="artista">' + esc(b.artista) + '</div>' : '') +
          (b.linha ? '<p class="linha">' + md(b.linha) + '</p>' : '') +
          '<div class="info"><span>' + c.duracao_texto + '</span>' + (b.info ? '<span>' + esc(b.info) + '</span>' : '') + '</div>' +
          '<div class="btns"><button class="b3d claro" data-i="' + i + '">' + IC_PLAY + 'Assistir</button>' + baixar(c) + '</div>' +
        '</div>' +
        '<button class="cartaz" data-i="' + i + '" aria-label="Assistir ' + esc(c.titulo) + '"><img src="' + (b.imagem || c.poster) + '" alt="">' +
          '<span class="playbig"><span>' + IC_PLAY + '</span></span></button>' +
      '</div>' +
      '<div class="ficha fechada">' +
        '<div><h3>' + esc(p.titulo || "Como foi feito").replace(/(feito)$/, "<em>$1</em>") + '</h3>' +
          (p.resumo ? '<p class="resumo">' + md(p.resumo) + '</p>' : '') +
          (p.numeros ? '<div class="numeros">' + p.numeros.map(function(n){
            return '<div><b>' + esc(n[0]) + '</b><span>' + esc(n[1]) + '</span></div>'; }).join("") + '</div>' : '') +
        '</div>' +
        '<div>' + (p.etapas ? '<ol>' + p.etapas.map(function(e){ return '<li><div>' + md(e) + '</div></li>'; }).join("") + '</ol>' +
            '<button class="mais" data-abre>Ver todas as ' + p.etapas.length + ' etapas</button>' : '') +
          // cada programa: [nome, funcao, logo] vira cartao; texto solto vira etiqueta simples
          (p.ferramentas ? '<div class="progs"><em>Programas usados</em><div class="apps">' + p.ferramentas.map(function(f){
            if(typeof f === "string") return '<span class="txt-only">' + esc(f) + '</span>';
            return '<div class="app">' + (f[2] ? '<img src="' + f[2] + '" alt="">' : '') +
              '<div><b>' + esc(f[0]) + '</b>' + (f[1] ? '<small>' + esc(f[1]) + '</small>' : '') + '</div></div>';
          }).join("") + '</div></div>' : '') +
        '</div>' +
      '</div>';
  }

  var ROMANOS = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
  $("secoes").innerHTML = GRUPOS.map(function(g, k){
    var itens = G.cortes.filter(function(c){ return c.grupo === g.nome; });
    var dest = itens.filter(function(c){ return c.processo; });
    var resto = itens.filter(function(c){ return !c.processo; });
    return '<section>' +
      '<div class="sec">' + (ROMANOS[k] || k + 1) + ' · ' + esc(g.nome) +
        (dest.length ? '' : '<small>' + itens.length + (itens.length === 1 ? ' vídeo' : ' vídeos') + '</small>') + '</div>' +
      (g.subtitulo && !dest.length ? '<p class="sec-sub">' + esc(g.subtitulo) + '</p>' : '') +
      dest.map(destaque).join("") +
      (resto.length ? '<div class="grade">' + resto.map(card).join("") + '</div>' : '') +
    '</section>';
  }).join("");

  // documentos no fim (legendas .docx etc.): capa + botao de baixar
  if((G.documentos || []).length){
    $("secoes").innerHTML += '<section><div class="sec">' + (ROMANOS[GRUPOS.length] || GRUPOS.length + 1) +
      ' · Legendas prontas para postar</div>' + G.documentos.map(function(d){
        var nome = d.arquivo.split("/").pop();
        return '<div class="docx rev" style="--d:360ms">' +
          (d.capa ? '<a class="docx-capa" href="' + d.arquivo + '" download="' + esc(nome) + '"><img src="' + d.capa + '" alt="' + esc(d.titulo) + '" loading="lazy"></a>' : '') +
          '<div class="docx-txt"><div class="tag">Documento Word</div><h2>' + esc(d.titulo) + '</h2>' +
            (d.subtitulo ? '<p class="linha">' + esc(d.subtitulo) + '</p>' : '') +
            '<a class="b3d ouro" href="' + d.arquivo + '" download="' + esc(nome) + '">' + IC_DOWN + esc(d.botao || "Baixar") + '</a>' +
          '</div></div>';
      }).join("") + '</section>';
  }

  $("rodape").innerHTML = (G.logo ? '<img src="' + G.logo + '" alt="">' : '') +
    "Arquivos em 1080×1920, prontos para postar." + (G.credito ? "<br>" + esc(G.credito) : "");

  /* --------------------------------------------------------------- player */
  var atual = -1;
  function abrir(i){
    atual = i; var c = ORDEM[i];
    $("player").src = c.video; $("ptit").textContent = c.titulo;
    if(G.download){ $("pdown").hidden = false; $("pdown").href = c.video;
      $("pdown").setAttribute("download", c.titulo + ".mp4"); $("pdown").innerHTML = IC_DOWN + "Baixar vídeo"; }
    $("prev").disabled = i === 0; $("next").disabled = i === ORDEM.length - 1;
    $("modal").classList.add("on"); document.body.style.overflow = "hidden";
    $("player").play().catch(function(){});
  }
  function sair(){
    $("modal").classList.remove("on"); $("player").pause(); $("player").removeAttribute("src"); $("player").load();
    document.body.style.overflow = ""; atual = -1;
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest("[data-abre]");
    if(a){ a.closest(".ficha").classList.remove("fechada"); return; }
    var t = e.target.closest("[data-i]");
    if(t) abrir(+t.dataset.i);
  });
  $("x").onclick = sair;
  $("modal").onclick = function(e){ if(e.target === $("modal")) sair(); };
  $("prev").onclick = function(){ if(atual > 0) abrir(atual - 1); };
  $("next").onclick = function(){ if(atual < ORDEM.length - 1) abrir(atual + 1); };
  document.addEventListener("keydown", function(e){
    if(!$("modal").classList.contains("on")) return;
    if(e.key === "Escape") sair();
    if(e.key === "ArrowRight" && atual < ORDEM.length - 1) abrir(atual + 1);
    if(e.key === "ArrowLeft" && atual > 0) abrir(atual - 1);
  });
})();
</script>
</body>
</html>
